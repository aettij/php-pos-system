worker_processes auto;
error_log /dev/stderr warn;
events { multi_accept on; worker_connections 1024; }
http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json;
  server {
    listen 8080 default_server;
    root /var/www/superma;
    index index.php;
    add_header X-Frame-Options "DENY" always;
    location /api/sse {
      proxy_buffering off; proxy_cache off;
      fastcgi_pass 127.0.0.1:9000; include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_read_timeout 120;
    }
    location / { try_files $uri /index.php$is_args$args; }
    location ~ \.php$ { fastcgi_pass 127.0.0.1:9000; fastcgi_index index.php; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_read_timeout 120; }
    location ~ /(config|includes|logs|deploy) { deny all; }
  }
}
